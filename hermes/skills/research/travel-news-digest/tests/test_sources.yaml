sources:
  - name: Test RSS
    url: https://ratanews.ru/
    fetch: rss
    rss: https://ratanews.ru/rss.xml
    region: ru
    priority: P1
    topics: [aviation, hotels, business_travel, general]

  - name: Test Google News
    fetch: google_news
    query: "авиакомпании рейсы 2026"
    hl: ru
    gl: RU
    region: ru
    priority: P1
    topics: [aviation]

  - name: Test curl_cffi
    url: https://tourprom.ru/
    fetch: curl_cffi
    impersonate: safari
    selector: "a[href*='/news/']"
    text_min_length: 30
    region: ru
    priority: P2
    topics: [aviation, hotels, general]

keywords:
  aviation:
    ru: [авиа, рейс, самолёт, аэрофлот, аэропорт]
    en: [airline, flight, aircraft, boeing, airbus]
  hotels:
    ru: [отель, гостиниц, проживание, бронирование]
    en: [hotel, marriott, hilton, hospitality]
  business_travel:
    ru: [командир, деловой, бизнес-тревел, корпоративн]
    en: [business travel, corporate travel, gbta, tmc]