# Sources configuration for fetch_travel_news.py
# Format: YAML list of source definitions
# Fetch types: rss, html, curl_cffi, google_news
# Regions: ru, intl
# Priorities: P1 (must), P2 (should), P3 (optional)
# Topics: aviation, hotels, business_travel, mice, general

sources:
  # ═══════════════════════════════════════
  # РФ — P1 (ОБЯЗАТЕЛЬНО)
  # ═══════════════════════════════════════

  - name: BBT
    url: https://buyingbusinesstravel.com.ru/news/
    fetch: rss
    rss: https://buyingbusinesstravel.com.ru/news/rss/
    region: ru
    priority: P1
    topics: [business_travel, aviation, hotels, mice]

  - name: RATA News
    url: https://ratanews.ru/
    fetch: rss
    rss: https://ratanews.ru/rss.xml
    region: ru
    priority: P1
    topics: [aviation, hotels, business_travel, general]

  - name: АвиаПорт
    url: https://www.aviaport.ru/news/
    fetch: rss
    rss: https://www.aviaport.ru/rss/
    region: ru
    priority: P1
    topics: [aviation]

  - name: АТОР
    url: https://www.atorus.ru/news/
    fetch: html
    region: ru
    priority: P1
    topics: [aviation, hotels, general]
    # browser-only, no RSS; selector for headlines
    selector: "h2 a"

  - name: Турдом
    url: https://www.tourdom.ru/news
    fetch: rss
    rss: https://www.tourdom.ru/rss/
    region: ru
    priority: P1
    topics: [aviation, hotels, general]

  - name: Коммерсантъ
    url: https://www.kommersant.ru/
    fetch: rss
    rss: https://www.kommersant.ru/rss/news.xml
    region: ru
    priority: P1
    topics: [aviation, hotels, business_travel, general]

  - name: Интерфакс
    url: https://www.interfax.ru/
    fetch: rss
    rss: https://www.interfax.ru/rss.asp
    region: ru
    priority: P1
    topics: [aviation, hotels, business_travel, general]

  # ═══════════════════════════════════════
  # РФ — P2 (ЖЕЛАТЕЛЬНО)
  # ═══════════════════════════════════════

  - name: Sostav.ru
    url: https://www.sostav.ru/
    fetch: rss
    rss: https://www.sostav.ru/rss/
    region: ru
    priority: P2
    topics: [business_travel, general]

  - name: Турпром
    url: https://tourprom.ru/
    fetch: html
    region: ru
    priority: P2
    topics: [aviation, hotels, general]
    selector: "h2 a, h3 a"

  - name: Event-Industry.ru
    url: https://www.event-industry.ru/
    fetch: html
    region: ru
    priority: P2
    topics: [mice]
    selector: "h2 a, h3 a"

  - name: Клерк.Ру
    url: https://www.klerk.ru/
    fetch: html
    region: ru
    priority: P2
    topics: [business_travel]
    selector: "h2 a, .news-title a"
    # /feed/ returns HTML, not RSS

  - name: Ведомости
    url: https://www.vedomosti.ru/
    fetch: rss
    rss: https://www.vedomosti.ru/rss/news
    region: ru
    priority: P2
    topics: [aviation, hotels, business_travel, general]

  - name: Logistics.ru
    url: https://logistics.ru/
    fetch: html
    region: ru
    priority: P2
    topics: [business_travel]
    selector: "h2 a, h3 a"

  # ═══════════════════════════════════════
  # РФ — P3 (ОПЦИОНАЛЬНО)
  # ═══════════════════════════════════════

  - name: Lenta.ru
    url: https://lenta.ru/
    fetch: rss
    rss: https://lenta.ru/rss
    region: ru
    priority: P3
    topics: [general]

  - name: RB.ru
    url: https://rb.ru/
    fetch: rss
    rss: https://rb.ru/rss
    region: ru
    priority: P3
    topics: [business_travel, general]

  # ═══════════════════════════════════════
  # МЕЖДУНАРОДНЫЕ — P1 (ОБЯЗАТЕЛЬНО)
  # ═══════════════════════════════════════

  - name: Skift
    url: https://skift.com/
    fetch: rss
    rss: https://skift.com/feed/
    region: intl
    priority: P1
    topics: [aviation, hotels, business_travel, mice, general]

  - name: Simple Flying
    url: https://simpleflying.com/
    fetch: rss
    rss: https://simpleflying.com/feed/
    region: intl
    priority: P1
    topics: [aviation]

  - name: FlightGlobal
    url: https://www.flightglobal.com/
    fetch: rss
    rss: https://www.flightglobal.com/feed
    region: intl
    priority: P1
    topics: [aviation]

  - name: The Points Guy
    url: https://thepointsguy.com/
    fetch: rss
    rss: https://thepointsguy.com/feed/
    region: intl
    priority: P1
    topics: [aviation, hotels]

  - name: GBTA
    url: https://www.gbta.org/
    fetch: rss
    rss: https://www.gbta.org/feed/
    region: intl
    priority: P1
    topics: [business_travel]

  - name: Travel Weekly
    url: https://www.travelweekly.com/Travel-News
    fetch: curl_cffi
    impersonate: safari
    region: intl
    priority: P1
    topics: [aviation, hotels, business_travel]
    selector: "a[href*='-News/']"
    # Cloudflare — curl_cffi+safari bypasses (tested 2026-08-12)
    # Fallback: archive.org

  # ═══════════════════════════════════════
  # МЕЖДУНАРОДНЫЕ — P2 (ЖЕЛАТЕЛЬНО)
  # ═══════════════════════════════════════

  - name: Skift Meetings
    url: https://skift.com/meetings/
    fetch: rss
    rss: https://skift.com/meetings/feed/
    region: intl
    priority: P2
    topics: [mice]

  - name: AeroTelegraph
    url: https://www.aerotelegraph.com/
    fetch: rss
    rss: https://www.aerotelegraph.com/feed
    region: intl
    priority: P2
    topics: [aviation]

  - name: The Company Dime
    url: https://www.thecompanydime.com/
    fetch: rss
    rss: https://www.thecompanydime.com/feed/
    region: intl
    priority: P2
    topics: [business_travel]

  - name: 4Hoteliers
    url: https://www.4hoteliers.com/
    fetch: rss
    rss: https://www.4hoteliers.com/rss/
    region: intl
    priority: P2
    topics: [hotels]

  - name: Airlive
    url: https://airlive.net/
    fetch: rss
    rss: https://airlive.net/feed/
    region: intl
    priority: P2
    topics: [aviation]

  - name: View from the Wing
    url: https://viewfromthewing.com/
    fetch: rss
    rss: https://viewfromthewing.com/feed/
    region: intl
    priority: P2
    topics: [aviation]

  - name: Cranky Flier
    url: https://crankyflier.com/
    fetch: rss
    rss: https://crankyflier.com/feed/
    region: intl
    priority: P2
    topics: [aviation]

  - name: BTN
    url: https://www.businesstravelnews.com/
    fetch: curl_cffi
    impersonate: safari
    region: intl
    priority: P2
    topics: [business_travel]
    selector: "h2 a, h3 a"
    # Cloudflare — curl_cffi+safari bypasses

  - name: PhocusWire
    url: https://www.phocuswire.com/
    fetch: curl_cffi
    impersonate: safari
    region: intl
    priority: P2
    topics: [general]
    selector: "h2 a, h3 a"

  - name: Hotel News Now
    url: https://www.hotelnewsnow.com/
    fetch: curl_cffi
    impersonate: safari
    region: intl
    priority: P2
    topics: [hotels]
    selector: "h2 a, h3 a"

  # ═══════════════════════════════════════
  # МЕЖДУНАРОДНЫЕ — P3 (ОПЦИОНАЛЬНО)
  # ═══════════════════════════════════════

  - name: Aviation Herald
    url: https://avherald.com/
    fetch: html
    region: intl
    priority: P3
    topics: [aviation]
    selector: "a[href*='avherald.com']"

  - name: CAPA
    url: https://centreforaviation.com/
    fetch: html
    region: intl
    priority: P3
    topics: [aviation]
    selector: "h2 a, h3 a"

  - name: Business Traveller UK
    url: https://www.businesstraveller.com/
    fetch: rss
    rss: https://www.businesstraveller.com/feed/
    region: intl
    priority: P3
    topics: [business_travel]

  - name: TTG Asia
    url: https://www.ttgasia.com/
    fetch: rss
    rss: https://www.ttgasia.com/feed/
    region: intl
    priority: P3
    topics: [general]

  # ═══════════════════════════════════════
  # GOOGLE NEWS RSS (МЕТА-АГРЕГАТОР)
  # ═══════════════════════════════════════

  - name: GN RU Aviation
    fetch: google_news
    query: "авиакомпании рейсы аэропорт 2026"
    hl: ru
    gl: RU
    region: ru
    priority: P1
    topics: [aviation]

  - name: GN RU Hotels
    fetch: google_news
    query: "отели гостиницы бронирование 2026"
    hl: ru
    gl: RU
    region: ru
    priority: P1
    topics: [hotels]

  - name: GN RU Business Travel
    fetch: google_news
    query: "командировки деловой туризм 2026"
    hl: ru
    gl: RU
    region: ru
    priority: P1
    topics: [business_travel]

  - name: GN EN Aviation
    fetch: google_news
    query: "aviation airline industry news"
    hl: en
    gl: US
    ceid: "US:en"
    region: intl
    priority: P2
    topics: [aviation]

  - name: GN EN Hotels
    fetch: google_news
    query: "hotel hospitality industry news"
    hl: en
    gl: US
    ceid: "US:en"
    region: intl
    priority: P2
    topics: [hotels]

  - name: GN EN Business Travel
    fetch: google_news
    query: "business travel corporate travel news"
    hl: en
    gl: US
    ceid: "US:en"
    region: intl
    priority: P2
    topics: [business_travel]

# ═════════════════════════════════════════
# KEYWORDS FOR CLASSIFICATION
# ═════════════════════════════════════════

keywords:
  aviation:
    ru: [авиа, рейс, перелёт, самолёт, аэропорт, авиакомпания, лётчик, борт, воздушный]
    en: [airline, flight, aircraft, aviation, airport, Boeing, Airbus, pilot, fleet, route]
  hotels:
    ru: [отель, гостиниц, проживание, бронирование, номер, апартамент, ресепшн]
    en: [hotel, hospitality, resort, accommodation, booking, room, guest, Marriott, Hilton, Accor]
  business_travel:
    ru: [командир, деловой, бизнес-тревел, корпоративный, суточн, расход, MICE, мероприятие, конференц]
    en: [business travel, corporate travel, TMC, travel management, MICE, meetings, incentive, expense, per diem]