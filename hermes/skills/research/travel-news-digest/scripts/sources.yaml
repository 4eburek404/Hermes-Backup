  # ═══════════════════════════════════════════
  # Google News RSS (мета-агрегатор)
  # ═══════════════════════════════════════════

  - name: GN RU Aviation
    fetch: google_news
    query: "авиакомпании рейсы аэропорт 2026"
    hl: ru
    gl: RU
    region: ru
    priority: P1
    topics: [aviation]

  - name: GN RU Hotels
    fetch: google_news
    query: "отели гостиницы бронирование 2026"
    hl: ru
    gl: RU
    region: ru
    priority: P2
    topics: [hotels]

  - name: GN RU Business Travel
    fetch: google_news
    query: "командировки деловой туризм 2026"
    hl: ru
    gl: RU
    region: ru
    priority: P1
    topics: [business_travel]

  - name: GN EN Aviation
    fetch: google_news
    query: "airline aviation industry news 2026"
    hl: en
    gl: US
    ceid: "US:en"
    region: intl
    priority: P2
    topics: [aviation]

  - name: GN EN Hotels
    fetch: google_news
    query: "hotel hospitality industry news 2026"
    hl: en
    gl: US
    ceid: "US:en"
    region: intl
    priority: P2
    topics: [hotels]

  - name: GN EN Business Travel
    fetch: google_news
    query: "business travel corporate travel news 2026"
    hl: en
    gl: US
    ceid: "US:en"
    region: intl
    priority: P2
    topics: [business_travel]

# Keyword dictionaries for classification
keywords:
  aviation:
    ru: [авиа, рейс, перелёт, самолёт, аэропорт, авиакомпания, лоукост, борт, пилот, аэрофлот, s7,胜利, уральские, победа, авиалин, турбо, вертолёт, беспилот, воздушн, катастроф, тайфун, аэродром, диспетчер]
    en: [airline, flight, aircraft, aviation, airport, Boeing, Airbus, pilot, jet, fleet, route, low-cost, carrier, ATR, turboprop, runway, airspace, FAA, EASA, IATA, ICAO]
  hotels:
    ru: [отель, гостиниц, проживание, бронирование, номер, ресепшн, люкс, апартамент, хостел, курорт, спа, ресторан, hoReCa, общепит]
    en: [hotel, hospitality, resort, accommodation, booking, room, suite, Marriott, Hilton, Hyatt, IHG, Accor, Radisson, lodging, guesthouse, motel]
  business_travel:
    ru: [командир, деловой, бизнес-тревел, корпоративн, суточн, расход, поездка, MICE, мероприяти, конференц, форум, делегат, тревел-менеджмент, тревел-политик]
    en: [business travel, corporate travel, TMC, MICE, meetings, incentive, conference, exhibition, travel management, travel policy, expense, per diem, GBTA, duty of care]
