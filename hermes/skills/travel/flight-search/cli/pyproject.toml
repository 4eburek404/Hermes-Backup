[project]
name = "flights-cli"
version = "0.10.1"
description = "Provider-policy flight routing helper for Hermes live flight-search workflows"
requires-python = ">=3.10"
dependencies = [
  "httpx2==2.9.1",
  "jsonschema>=4.22,<5",
  "mcp==1.28.1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pyflakes>=3.4,<4",
  "pytest>=9.1,<10",
  "ruff>=0.15,<0.16",
  "vulture>=2.16,<3",
]

[project.scripts]
flights = "flights_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["flights_cli*"]

[tool.setuptools.package-data]
"flights_cli.contracts" = ["*.schema.json"]
"flights_cli.data" = ["*.yaml"]

[tool.pytest.ini_options]
markers = [
  "live_provider: opt-in tests that call live provider services or MCP servers",
]
