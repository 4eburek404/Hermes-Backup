name: tutu-search-flights

on:
  pull_request:
    paths:
      - 'hermes/skills/travel/tutu-search-flights/**'
      - '.github/workflows/tutu-search-flights.yml'
  push:
    paths:
      - 'hermes/skills/travel/tutu-search-flights/**'
      - '.github/workflows/tutu-search-flights.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r hermes/skills/travel/tutu-search-flights/requirements-dev.txt
      - name: Run deterministic checks
        working-directory: hermes/skills/travel/tutu-search-flights
        run: make PYTHON=python check
